name: Process Notification

on:
  workflow_dispatch:
    inputs:
      new_ids_csv:
        description: 'Comma-separated IDs of new notifications'
        required: true
        type: string
      first_title:
        description: 'Title of the first new notification'
        required: true
        type: string
      new_count:
        description: 'Number of new notifications detected'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Display run info
        run: |
          echo "================================================"
          echo "NEW NOTIFICATIONS : ${{ inputs.new_count }}"
          echo "FIRST TITLE       : ${{ inputs.first_title }}"
          echo "IDS               : ${{ inputs.new_ids_csv }}"
          echo "START TIME        : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================================"

      # ── Install uv and Python 3.12 with automatic wheel caching ──────────
      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "scripts/requirements.txt"

      # ── Create a real venv so PEP 668's "externally managed" lock on the
      # ── OS Python at /usr (Ubuntu 24.04) never applies — a venv is exempt.
      # ── Adding its bin/ to GITHUB_PATH makes every later step's plain
      # ── `python3` resolve to this venv automatically.
      - name: Create virtual environment
        run: |
          uv venv .venv
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      # ── Fast parallel install of all dependencies (incl. pyzipper) ───────
      - name: Install Python dependencies
        run: uv pip install -r scripts/requirements.txt

      # ── Decode the gzip-compressed, base64-encoded secret ──────────────────
      - name: Restore private Python script from secret
        env:
          PYTHON_SCRIPT: ${{ secrets.PYTHON_SCRIPT }}
        run: |
          echo "Decoding PYTHON_SCRIPT secret…"
          echo "$PYTHON_SCRIPT" | base64 -d | gunzip > scripts/process_notification.py
          echo "✓ Decoded successfully ($(wc -c < scripts/process_notification.py) bytes)"

      # ── Cache the CNN model, with an integrity check before trusting it ───
      - name: Cache CNN model
        id: cache-cnn
        uses: actions/cache@v6.1.0
        with:
          path: scripts/anna_cnn_v2.keras
          key: cnn-model-anna-v2

      - name: Verify cached model (if restored)
        if: steps.cache-cnn.outputs.cache-hit == 'true'
        run: |
          SIZE=$(wc -c < scripts/anna_cnn_v2.keras)
          echo "Cached model size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::warning::Cached model looks too small (${SIZE} bytes) — treating as invalid"
            rm -f scripts/anna_cnn_v2.keras
          fi

      - name: Download CNN model (on cache miss or failed verification)
        run: |
          if [ ! -f scripts/anna_cnn_v2.keras ]; then
            echo "Downloading model from Hugging Face…"
            wget "https://huggingface.co/TDB001/COE-SCRAPPER-CNN/resolve/main/anna_cnn_v2.keras?download=true" \
              -O scripts/anna_cnn_v2.keras

            SIZE=$(wc -c < scripts/anna_cnn_v2.keras)
            echo "Downloaded size: ${SIZE} bytes"
            if [ "$SIZE" -lt 1000000 ]; then
              echo "::error::Downloaded model is suspiciously small (${SIZE} bytes) — likely not a real model file"
              exit 1
            fi
          else
            echo "✓ Using verified cached model."
          fi

      # ── Syntax-check decoded script ────────────────────────────────────────
      - name: Syntax-check decoded script
        run: |
          python3 -m py_compile scripts/process_notification.py
          echo "✓ Syntax OK"

      - name: Run Python report generator
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "Running process_notification.py..."
          python3 scripts/process_notification.py "${{ inputs.new_ids_csv }}" data/notifications.json
          echo "✓ Script completed successfully"

      # ── Pack every output into ONE password-protected zip ─────────────────
      # Password is stored in the repo secret ZIP_PASSWORD
      # (Settings → Secrets and variables → Actions)
      - name: Create encrypted ZIP
        if: always()
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, glob, pyzipper

          password = os.environ["ZIP_PASSWORD"].encode("utf-8")
          run_id = os.environ["GITHUB_RUN_ID"]
          out = f"outputs-{run_id}.zip"

          patterns = [
              "anna_results.csv",
              "anna_summary_*.csv",
              "students.csv",
              "result_pages",
              "generated_files",
          ]

          files = []
          for p in patterns:
              for match in glob.glob(p):
                  if os.path.isdir(match):
                      for root, _, names in os.walk(match):
                          files += [os.path.join(root, n) for n in names]
                  else:
                      files.append(match)

          if not files:
              print("::warning::No output files found, skipping zip")
              raise SystemExit(0)

          with pyzipper.AESZipFile(out, "w",
                                   compression=pyzipper.ZIP_DEFLATED,
                                   encryption=pyzipper.WZ_AES) as zf:
              zf.setpassword(password)
              zf.setencryption(pyzipper.WZ_AES, nbits=256)
              for f in files:
                  zf.write(f, arcname=f)

          print(f"✓ Created {out} with {len(files)} files")
          EOF

      - name: Upload encrypted ZIP
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: outputs-${{ github.run_id }}
          path: outputs-${{ github.run_id }}.zip
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "PROCESS COMPLETE"
          echo "NEW NOTIFICATIONS : ${{ inputs.new_count }}"
          echo "FIRST TITLE       : ${{ inputs.first_title }}"
          echo "IDS               : ${{ inputs.new_ids_csv }}"
          echo "================================================"
